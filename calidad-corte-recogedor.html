<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recogedor — Labores JN</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#187a4d" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell" style="max-width: 760px;">
      <header class="topbar">
        <div>
          <p class="eyebrow">Producción / Calidad Corte</p>
          <h1>✅ Recogedor</h1>
        </div>
        <section class="status-strip">
          <span class="pill strong" id="usuarioPill">Usuario</span>
          <a href="./calidad-corte.html" class="pill">← Calidad Corte</a>
        </section>
      </header>

      <section class="workspace" style="grid-template-columns: 1fr;">
        <article class="scanner-panel" style="text-align:center;">
          <h2>✅ Recogedor</h2>
          <p class="hint">Módulo de calidad para Recogedor listo para agregar sus funciones.</p>
        </article>
      </section>
    </main>

    <script>
      const sesion = JSON.parse(sessionStorage.getItem("labores_usuario") || "null");
      if (!sesion) {
        window.location.href = "./login.html";
      } else {
        document.querySelector("#usuarioPill").textContent = sesion.empleadoNombre || sesion.username;
      }
    </script>
    <script src="./offline/register-sw.js"></script>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corte — Labores JN</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#187a4d" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .module-card {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 140px;
      }
      .module-icon {
        font-size: 2.2rem;
        line-height: 1;
        margin-bottom: 10px;
      }
      .module-card h2 {
        margin: 0 0 8px;
        text-align: center;
      }
      .module-card .hint {
        margin: 0;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="app-shell" style="max-width: 760px;">
      <header class="topbar">
        <div>
          <p class="eyebrow">Producción / Corte</p>
          <h1>✂️ Corte</h1>
        </div>
        <section class="status-strip">
          <span class="pill strong" id="usuarioPill">Usuario</span>
          <a href="./menu.html" class="pill">← Menú principal</a>
        </section>
      </header>

      <section class="workspace" style="grid-template-columns: 1fr 1fr;">
        <article class="scanner-panel module-card" style="text-align:center;cursor:pointer" onclick="location.href='./corte-garruchero.html'">
          <div class="module-icon" aria-hidden="true">🪝</div>
          <h2>Garruchero</h2>
          <p class="hint">Módulo de Corte para Garruchero.</p>
        </article>
        <article class="scanner-panel module-card" style="text-align:center;cursor:pointer" onclick="location.href='./corte-recogedor.html'">
          <div class="module-icon" aria-hidden="true">🧺</div>
          <h2>Recogedor</h2>
          <p class="hint">Módulo de Corte para Recogedor.</p>
        </article>
        <article class="scanner-panel module-card" style="text-align:center;cursor:pointer" onclick="location.href='./corte-cortador.html'">
          <div class="module-icon" aria-hidden="true">✂️</div>
          <h2>Cortador</h2>
          <p class="hint">Módulo de Corte para Cortador.</p>
        </article>
      </section>
    </main>

    <script>
      const sesion = JSON.parse(sessionStorage.getItem("labores_usuario") || "null");
      if (!sesion) {
        window.location.href = "./login.html";
      } else {
        document.querySelector("#usuarioPill").textContent = sesion.empleadoNombre || sesion.username;
      }
    </script>
    <script src="./offline/register-sw.js"></script>
  </body>
</html>

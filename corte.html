<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Corte — Labores JN</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#187a4d" />
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .corte-tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 16px;
        overflow-x: auto;
        padding-bottom: 2px;
      }
      .corte-tab {
        flex: 1 0 150px;
        min-height: 48px;
        border: 1px solid rgba(24, 122, 77, 0.22);
        border-radius: 12px;
        background: #f5faf7;
        color: #184c35;
        font-weight: 800;
        cursor: pointer;
      }
      .corte-tab.active {
        background: #187a4d;
        color: #fff;
        box-shadow: 0 6px 16px rgba(24, 122, 77, 0.18);
      }
      .corte-tab:not(.active):hover {
        background: #eaf5ef;
      }
    </style>
  </head>
  <body>
    <main class="app-shell" style="max-width: 760px;">
      <header class="topbar">
        <div>
          <p class="eyebrow">Producción / Corte</p>
          <h1 id="corteTitulo">✂️ Corte - Cortador</h1>
        </div>
        <section class="status-strip">
          <span class="pill strong" id="usuarioPill">Usuario</span>
          <a href="./menu.html" class="pill">← Menú principal</a>
        </section>
      </header>

      <nav class="corte-tabs" aria-label="Tipo de labor de Corte">
        <button class="corte-tab active" type="button" data-corte-rol="cortador">Cortador</button>
        <button class="corte-tab" type="button" data-corte-rol="garruchero">Transportador</button>
        <button class="corte-tab" type="button" data-corte-rol="recogedor">Recogedor</button>
      </nav>

      <section class="workspace" style="grid-template-columns: minmax(0, 1fr);">
        <article class="scanner-panel">
          <div>
            <span class="scan-label">Labor seleccionada</span>
            <p class="hint" id="rolSeleccionado" style="margin: 6px 0 0;">Cortador</p>
          </div>

          <section class="result-card" style="margin-top:16px;">
            <div class="result-status">
              <span class="dot"></span>
              <strong id="estadoModulo">Formulario de Cortador listo para agregar sus campos.</strong>
            </div>
          </section>
        </article>
      </section>
    </main>

    <script src="./corte.js?v=1.0.33"></script>
    <script src="./offline/register-sw.js"></script>
  </body>
</html>

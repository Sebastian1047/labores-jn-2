<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calidad Desbotón y Mallas — Labores JN</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#187a4d" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell" style="max-width: 760px;">
    <header class="topbar">
      <div>
        <p class="eyebrow">Producción / Calidad Desbotón y Mallas</p>
        <h1>✅ Calidad Desbotón y Mallas</h1>
      </div>
      <section class="status-strip">
        <span class="pill strong" id="usuarioPill">Modo prueba</span>
        <a href="./menu.html" class="pill">← Menú principal</a>
      </section>
    </header>

    <section class="workspace" style="grid-template-columns: 1fr 1fr;">
      <article class="scanner-panel module-card" style="text-align:center;cursor:pointer" onclick="location.href='./calidad-desboton-spider-cremon.html'">
        <div class="module-icon" aria-hidden="true">🌸</div>
          <h2>Desbotón Spider/Cremon</h2>
        <p class="hint">Formulario de evaluación de calidad.</p>
      </article>
      <article class="scanner-panel module-card" style="text-align:center;cursor:pointer" onclick="location.href='./calidad-desboton-pompon.html'">
        <div class="module-icon" aria-hidden="true">🌼</div>
          <h2>Desbotón Pompón</h2>
        <p class="hint">Formulario de evaluación de calidad.</p>
      </article>
      <article class="scanner-panel module-card" style="text-align:center;cursor:pointer" onclick="location.href='./desbotonado-mallas.html'">
        <div class="module-icon" aria-hidden="true">🕸️</div>
          <h2>Mallas</h2>
        <p class="hint">Formulario de Mallas.</p>
      </article>
    </section>
  </main>
  <script>
    const sesion = JSON.parse(sessionStorage.getItem("labores_usuario") || "null") || {
      username: "PRUEBA.WEB", role: "Administrador", empleadoNombre: "Modo prueba"
    };
    document.querySelector("#usuarioPill").textContent = sesion.empleadoNombre || sesion.username;
  </script>
  <script src="./offline/register-sw.js"></script>
</body>
</html>

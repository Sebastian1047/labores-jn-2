<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Promedios Siembra — Labores JN</title>
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#187a4d" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Producción / Siembra Campo</p>
          <h1>📊 Detalle — Promedios</h1>
        </div>
        <section class="status-strip">
          <span class="pill" id="apiStatusPill">API…</span>
          <span class="pill strong" id="usuarioPill">Usuario</span>
          <a href="./siembra-hub.html" class="pill">← Hub</a>
        </section>
      </header>

      <article class="scanner-panel">
        <form class="exit-row" style="grid-template-columns: repeat(3, minmax(160px, 1fr));" onsubmit="return false;">
          <label>Fecha inicial
            <input id="fechaInicio" type="date" />
          </label>
          <label>Fecha final
            <input id="fechaFinal" type="date" />
          </label>
        </form>
        <div class="action-row">
          <button id="verBtn" class="success-btn" type="button">Ver fechas</button>
          <button id="guardarHorasBtn" class="success-btn" type="button">💾 Guardar horas</button>
          <button id="exportarBtn" class="ghost-btn" type="button">📊 Exportar Excel</button>
        </div>
        <p id="horasStatus" class="hint"></p>

        <div class="summary-grid" style="grid-template-columns: repeat(3, minmax(0, 1fr));">
          <div class="summary-card"><span>Total esquejes</span><strong id="totalEsquejes">0</strong></div>
          <div class="summary-card"><span>Suma de promedios</span><strong id="sumaPromedios">0</strong></div>
          <div class="summary-card"><span>Rendimiento grupal</span><strong id="rendimientoGrupal">0</strong></div>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Colaborador</th>
                <th>Total esquejes</th>
                <th>Horas</th>
                <th>Rendimiento</th>
              </tr>
            </thead>
            <tbody id="tablaColaboradores"></tbody>
          </table>
        </div>
      </article>
    </main>

    <script src="./offline/api-base.js"></script>
    <script src="./offline/db.js"></script>
    <script src="./offline/sync-engine.js"></script>
    <script src="./offline/vendor/xlsx.full.min.js"></script>
    <script src="./siembra-promedios.js"></script>
    <script src="./offline/register-sw.js"></script>
  </body>
</html>
